on:
  push:
    paths: ['**.R', 'tests/**', '**.Rd', '**.c', '**.cpp', '**.h', '**.hpp', 'DESCRIPTION', 'NAMESPACE', 'MAKEVARS', 'MAKEVARS.win', '**.yml', 'renv.lock']
  pull_request:
    paths: ['**.R', 'tests/**', '**.Rd', '**.c', '**.cpp', '**.h', '**.hpp', 'DESCRIPTION', 'NAMESPACE', 'MAKEVARS', 'MAKEVARS.win', '**.yml', 'renv.lock']
  schedule:
    - cron: '13 12 * * 1-5'

name: unit-tests

jobs:
  unit-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (R ${{ matrix.r }} - ${{ matrix.packages }} packages)
    continue-on-error: ${{ matrix.packages == 'latest' }}

    strategy:
      fail-fast: false
      matrix:
        # The stored numerical regression baseline uses x86-64 arithmetic.
        os: [macos-26-intel, windows-latest, ubuntu-latest]
        r: ['4.5.2']
        packages: [lockfile]
        include:
        - os: ubuntu-latest
          r: '4.5.2'
          packages: latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-r-tests
        with:
          packages: ${{ matrix.packages }}

      - name: Run selection-model review regressions
        run: |
          pkgload::load_all()
          source(".github/scripts/selectionmodels-regression.R")
        shell: Rscript {0}

      - name: Run unit tests
        run: source("tests/testthat.R")
        shell: Rscript {0}

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-diffs-${{ matrix.os }}-${{ matrix.packages }}
          path: |
            tests/testthat/_snaps/**/*.new.svg
          if-no-files-found: ignore
